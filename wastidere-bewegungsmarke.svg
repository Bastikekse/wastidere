    <radialGradient id="iris" cx="458" cy="200" r="132" gradientUnits="userSpaceOnUse">
      <stop offset="0.45" stop-color="#7fd3ff"/>
      <stop offset="0.8" stop-color="#2f9fe0"/>
      <stop offset="1" stop-color="#14609c"/>
    </radialGradient>
    <clipPath id="half"><rect x="458" y="0" width="300" height="420"/></clipPath>
    <!-- Cut: the left half of the W is dilated and removed from the right half -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="-20" y="-20" width="700" height="460">
      <rect x="-20" y="-20" width="700" height="460" fill="#fff"/>
      <g class="gap" fill="#000" stroke="#000" stroke-width="16" stroke-linejoin="miter">
        <polygon points="22,40 98,40 188,360 112,360"/><polygon points="202,40 278,40 188,360 112,360"/>
      </g>
    </mask>
  </defs>


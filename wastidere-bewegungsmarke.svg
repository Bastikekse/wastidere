<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d">
  <title id="t">Wastidere Logo (animiert)</title>
  <desc id="d">Animiertes Logo, ca. 2,5 Sekunden: Ein W steht zunächst unversehrt da. Es wird in der Mitte durchgeschnitten, die rechte Hälfte rutscht ein Stück nach unten. Danach öffnet sich aus der rechten Hälfte ein halbes blaues Auge, das gemeinsam mit dem W ein D bildet.</desc>
  <style>
    /* Gemeinsamer 2,5-Sekunden-Loop */
    .right {
    transform: translate(6px, 14px);
    animation: cut 5s 1 forwards;
    }

    .gap {
        stroke-width: 16px;
        animation: gap 5s 1 forwards;
    }

    .eye {
        transform: scale(1, 1);
        animation: open 5s 1 forwards;
    }

    .shine {
        opacity: 1;
        animation: shine 5s 1 forwards;
    }

    /* Durchschneiden */
    @keyframes cut {
        0%, 12% {
            transform: translate(0px, 0px);
        }
        23%, 100% {
            transform: translate(6px, 14px);
        }
    }

    /* Abstand */
    @keyframes gap {
        0%, 12% {
            stroke-width: 0px;
        }
        23%, 100% {
            stroke-width: 16px;
        }
    }

    /* Auge öffnen */
    @keyframes open {
        0%, 25% {
            transform: scale(1, 0);
        }
        43%, 100% {
            transform: scale(1, 1);
        }
    }

    /* Lichtreflex */
    @keyframes shine {
        0%, 41% {
            opacity: 0;
        }
        49%, 100% {
            opacity: 1;
        }
    }

    /* Barrierefreiheit */
    @media (prefers-reduced-motion: reduce) {
        .right, .gap, .eye, .shine {
            animation: none;
        }
    }
  </style>
